name: grafana-yamcs-quickstart-drone

services:
  yamcs:
    build:
      context: ..
      dockerfile: docker/yamcs/Dockerfile
    hostname: yamcs
    container_name: grafana-yamcs-quickstart-drone-yamcs
    working_dir: /workspace
    command: "./mvnw yamcs:run"
    environment:
      YAMCS_TC_HOST: simulator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ../:/workspace
      - yamcs-images:/tmp/images
    ports:
      - "8090:8090"
      - "10015:10015/udp"
    networks:
      - demo

  simulator:
    build:
      context: ..
      dockerfile: docker/yamcs/Simulator.Dockerfile
    hostname: simulator
    container_name: grafana-yamcs-quickstart-drone-simulator
    working_dir: /workspace
    command: "python3 simulator.py --tm_host yamcs --tc_host 0.0.0.0"
    volumes:
      - ../:/workspace:ro
    networks:
      - demo

  image-generator:
    build:
      context: ..
      dockerfile: docker/yamcs/ImageGenerator.Dockerfile
    hostname: image-generator
    container_name: grafana-yamcs-quickstart-drone-image-generator
    working_dir: /workspace
    command: "python3 simulator/images/generate_images.py --yamcs-host yamcs:8090 --public-yamcs-url http://localhost:8090 --image-dir /images"
    environment:
      PYTHONUNBUFFERED: "1"
      IMAGE_INTERVAL: ${IMAGE_INTERVAL:-0.5}
    depends_on:
      yamcs:
        condition: service_healthy
    volumes:
      - ../:/workspace:ro
      - yamcs-images:/images
    networks:
      - demo

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana-yamcs-quickstart-drone-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GRAFANA_YAMCS_PLUGIN_VERSION: ${GRAFANA_YAMCS_PLUGIN_VERSION:-1.1.1}
      GF_PLUGINS_PREINSTALL_SYNC: jaops-yamcs-app@${GRAFANA_YAMCS_PLUGIN_VERSION:-1.1.1}@https://github.com/jaops-space/grafana-yamcs-jaops/releases/download/v${GRAFANA_YAMCS_PLUGIN_VERSION:-1.1.1}/jaops-yamcs-app-${GRAFANA_YAMCS_PLUGIN_VERSION:-1.1.1}.zip
      YAMCS_HOST: ${YAMCS_HOST:-yamcs:8090}
      YAMCS_INSTANCE: ${YAMCS_INSTANCE:-demo}
      YAMCS_PROCESSOR: ${YAMCS_PROCESSOR:-realtime}
      YAMCS_USERNAME: ${YAMCS_USERNAME:-admin}
      YAMCS_PASSWORD: ${YAMCS_PASSWORD:-admin}
    depends_on:
      yamcs:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - demo

networks:
  demo:
    driver: bridge

volumes:
  yamcs-images:
